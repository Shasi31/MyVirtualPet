<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Virtual Pet</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(#b9e7ff, #f6fbff);
    min-height: 100vh;
    color: #253238;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 25px 18px;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #607d8b;
    margin-bottom: 25px;
}

.card {
    background: white;
    border-radius: 25px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

.pet-selection {
    display: flex;
    gap: 12px;
}

.pet-option {
    flex: 1;
    text-align: center;
    border: 3px solid #eee;
    border-radius: 20px;
    padding: 18px;
    cursor: pointer;
}

.pet-option.selected {
    border-color: #2196f3;
    background: #eef8ff;
}

.pet-icon {
    font-size: 70px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 17px;
    margin-top: 15px;
}

.main-button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 15px;
    margin-top: 15px;
    background: #2196f3;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.hidden {
    display: none;
}

.pet-home {
    text-align: center;
}

.pet-display {
    font-size: 120px;
    margin: 20px;
}

.pet-name {
    font-size: 30px;
    font-weight: bold;
}

.age {
    color: #607d8b;
    margin-bottom: 15px;
}

.stat {
    margin: 14px 0;
    text-align: left;
}

.stat-title {
    display: flex;
    justify-content: space-between;
}

.bar {
    background: #eee;
    border-radius: 20px;
    overflow: hidden;
    height: 13px;
    margin-top: 5px;
}

.bar-fill {
    height: 100%;
    background: #4caf50;
}

.actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.action-button {
    background: white;
    border: none;
    border-radius: 18px;
    padding: 15px 5px;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
    font-size: 28px;
    cursor: pointer;
}

.action-button span {
    display: block;
    font-size: 12px;
    margin-top: 5px;
    font-weight: bold;
}

.message {
    margin-top: 15px;
    background: #fff8dc;
    border-radius: 12px;
    padding: 12px;
}

.coins {
    font-weight: bold;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="container">

<div id="adoption">

<h1>🐾 My Virtual Pet</h1>
<div class="subtitle">
Choose your new best friend
</div>

<div class="card">

<div class="pet-selection">

<div class="pet-option selected"
onclick="selectPet('dog',this)">

<div class="pet-icon">🐶</div>

<b>Golden Retriever</b>
<br>
Dog

</div>

<div class="pet-option"
onclick="selectPet('cat',this)">

<div class="pet-icon">🐱</div>

<b>Orange Tabby</b>
<br>
Cat

</div>

</div>

<input
id="petNameInput"
placeholder="Give your pet a name">

<button
class="main-button"
onclick="adoptPet()">

❤️ Adopt My Pet

</button>

</div>
</div>


<div id="game" class="hidden">

<div class="card pet-home">

<div class="coins">
🪙 Coins: <span id="coins">20</span>
</div>

<div id="petDisplay" class="pet-display">
🐶
</div>

<div id="petName" class="pet-name">
Buddy
</div>

<div id="age" class="age">
Day 1 • Puppy
</div>

<div id="message" class="message">
Welcome home!
</div>

</div>


<div class="card">

<div class="stat">

<div class="stat-title">
<span>🍖 Hunger</span>
<span id="hungerNumber">80%</span>
</div>

<div class="bar">
<div id="hungerBar"
class="bar-fill"
style="width:80%">
</div>
</div>

</div>


<div class="stat">

<div class="stat-title">
<span>❤️ Happiness</span>
<span id="happyNumber">80%</span>
</div>

<div class="bar">
<div id="happyBar"
class="bar-fill"
style="width:80%">
</div>
</div>

</div>


<div class="stat">

<div class="stat-title">
<span>⚡ Energy</span>
<span id="energyNumber">80%</span>
</div>

<div class="bar">
<div id="energyBar"
class="bar-fill"
style="width:80%">
</div>
</div>

</div>

</div>


<div class="actions">

<button class="action-button"
onclick="feedPet()">
🍖
<span>Feed</span>
</button>

<button class="action-button"
onclick="playPet()">
🎾
<span>Play</span>
</button>

<button class="action-button"
onclick="sleepPet()">
😴
<span>Sleep</span>
</button>

<button class="action-button"
onclick="bathPet()">
🛁
<span>Bath</span>
</button>

<button class="action-button"
onclick="giveTreat()">
🦴
<span>Treat</span>
</button>

<button class="action-button"
onclick="nextDay()">
🌅
<span>Next Day</span>
</button>

</div>

</div>

</div>


<script>

let selectedPet = "dog";

let pet = {
name:"",
type:"dog",
day:1,
hunger:80,
happy:80,
energy:80,
coins:20
};


function selectPet(type,element){

selectedPet = type;

document
.querySelectorAll(".pet-option")
.forEach(x =>
x.classList.remove("selected")
);

element.classList.add("selected");

}


function adoptPet(){

let name =
document.getElementById(
"petNameInput"
).value.trim();

if(name === ""){
alert("Please give your pet a name.");
return;
}

pet.name = name;
pet.type = selectedPet;

saveGame();

document
.getElementById("adoption")
.classList.add("hidden");

document
.getElementById("game")
.classList.remove("hidden");

updateGame();

}


function feedPet(){

pet.hunger =
Math.min(100,pet.hunger+20);

pet.coins =
Math.max(0,pet.coins-1);

showMessage(
pet.name+" enjoyed the food! 🍖"
);

updateGame();
saveGame();

}


function playPet(){

if(pet.energy < 10){

showMessage(
pet.name+" is too tired to play 😴"
);

return;

}

pet.happy =
Math.min(100,pet.happy+20);

pet.energy =
Math.max(0,pet.energy-10);

pet.hunger =
Math.max(0,pet.hunger-5);

pet.coins += 2;

showMessage(
pet.name+" loved playing! 🎾 +2 coins"
);

updateGame();
saveGame();

}


function sleepPet(){

pet.energy =
Math.min(100,pet.energy+30);

showMessage(
pet.name+" had a nice sleep 😴"
);

updateGame();
saveGame();

}


function bathPet(){

pet.happy =
Math.min(100,pet.happy+5);

showMessage(
pet.name+" is clean and fresh! 🛁"
);

updateGame();
saveGame();

}


function giveTreat(){

if(pet.coins < 2){

showMessage(
"Not enough coins!"
);

return;

}

pet.coins -= 2;

pet.happy =
Math.min(100,pet.happy+10);

pet.hunger =
Math.min(100,pet.hunger+10);

showMessage(
pet.name+" loved the treat! 🦴"
);

updateGame();
saveGame();

}


function nextDay(){

pet.day++;

pet.hunger =
Math.max(0,pet.hunger-15);

pet.happy =
Math.max(0,pet.happy-8);

pet.energy =
Math.max(0,pet.energy-8);

pet.coins += 5;

showMessage(
"Good morning! 🌅 Day "
+pet.day+
" • Daily reward +5 coins"
);

updateGame();
saveGame();

}


function updateGame(){

document.getElementById(
"petName"
).innerText = pet.name;

document.getElementById(
"coins"
).innerText = pet.coins;


let stage;

if(pet.day <= 3)
stage = pet.type==="dog"
? "Small Puppy"
: "Small Kitten";

else if(pet.day <= 7)
stage = "Growing";

else if(pet.day <= 14)
stage = "Young";

else
stage = "Adult";


document.getElementById(
"age"
).innerText =
"Day "+pet.day+" • "+stage;


let icon;

if(pet.type==="dog"){

icon =
pet.day < 8
? "🐶"
: "🐕";

}else{

icon =
pet.day < 8
? "🐱"
: "🐈";

}

document.getElementById(
"petDisplay"
).innerText = icon;


updateBar(
"hunger",
pet.hunger
);

updateBar(
"happy",
pet.happy
);

updateBar(
"energy",
pet.energy
);

}


function updateBar(name,value){

document.getElementById(
name+"Bar"
).style.width =
value+"%";

document.getElementById(
name+"Number"
).innerText =
value+"%";

}


function showMessage(text){

document.getElementById(
"message"
).innerText = text;

}


function saveGame(){

localStorage.setItem(
"MyVirtualPet",
JSON.stringify(pet)
);

}


function loadGame(){

let saved =
localStorage.getItem(
"MyVirtualPet"
);

if(saved){

pet =
JSON.parse(saved);

document
.getElementById("adoption")
.classList.add("hidden");

document
.getElementById("game")
.classList.remove("hidden");

updateGame();

}

}


loadGame();

</script>

</body>
</html>
